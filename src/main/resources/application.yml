server:
  port: 8090
  servlet:
    session:
      tracking-modes: cookie # redirect 주소에 ;jsessionid 가 붙지 않도록
      cookie:
        http-only: true
        same-site: lax

spring:
  http:
    client:
      # esp-api 호출 타임아웃
      connect-timeout: 2s
      read-timeout: 3s

esp:
  # esp-api 주소
  base-url: http://localhost:8080
  # 토큰 검증 API 경로
  verify-path: /esp/api/v1/auth/sso
  # esp 에서 발급받은 3rd 식별자
  client-id: 3rd-A
  # esp 에서 발급받은 API Key 는 환경변수 ESP_SSO_API_KEY 로 주입
